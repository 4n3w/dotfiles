# foot — Wayland terminal. Replaces rxvt-unicode, which is X11-only.
#
# NOTE: foot gained `include=` only in 1.9, so unlike sway there is no config.d
# seam here — this one file has to be correct on every machine. Anything genuinely
# per-machine (font size on an unusual panel, say) means editing this file or
# launching foot with `--config=PATH`. Bear that in mind before adding something
# that is only right on one box.

[main]
font=JetBrainsMono Nerd Font:size=12
pad=4x4

[scrollback]
lines=10000

# `underline`, not `beam`. foot only learned `beam` after 1.6.4, and the uConsole is
# pinned to bullseye's 1.6.4 — an unsupported value there is a parse error on every
# terminal launch, not a silent fallback. Check the installed binary rather than the
# current docs before changing this:
#     strings $(command -v foot) | grep -xE 'block|beam|underline'
[cursor]
style=underline
blink=no

# Rose Pine — same palette as the sway config and the TTY setup, so the theme
# is consistent from bare console through to the compositor.
# Note: foot takes colors WITHOUT a leading '#'.
[colors]
background=191724
foreground=e0def4

selection-background=403d52
selection-foreground=e0def4

# normal
regular0=26233a
regular1=eb6f92
regular2=31748f
regular3=f6c177
regular4=9ccfd8
regular5=c4a7e7
regular6=ebbcba
regular7=e0def4

# bright
bright0=6e6a86
bright1=eb6f92
bright2=31748f
bright3=f6c177
bright4=9ccfd8
bright5=c4a7e7
bright6=ebbcba
bright7=e0def4
